<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070E0C"><title>ГрибСвязь</title>
<style>
:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;color:#F0EBDD;font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:radial-gradient(90% 55% at 100% 0%,rgba(60,200,140,.15),transparent 70%),radial-gradient(85% 55% at 0% 100%,rgba(242,61,87,.18),transparent 70%),#070E0C;overflow:hidden}
svg{width:132px;height:132px;overflow:visible;filter:drop-shadow(0 0 34px rgba(242,61,87,.55));animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{50%{transform:scale(1.07,1.1)}}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
p{margin:0;color:#8EA295;min-height:1.4em;max-width:30ch}
button{display:none;border:0;border-radius:17px;padding:14px 28px;font:700 16px system-ui,-apple-system,sans-serif;color:#fff;background:linear-gradient(150deg,#FF7F8E,#F23D57 45%,#B21636);box-shadow:0 12px 26px -10px rgba(242,61,87,.85)}
button:active{transform:scale(.97)}
.sp{position:fixed;bottom:-20px;width:6px;height:6px;border-radius:50%;background:#FFC46B;box-shadow:0 0 12px 2px rgba(255,196,107,.8);opacity:.55;animation:rise 9s linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<i class="sp" style="left:12%;animation-delay:-1s"></i><i class="sp" style="left:34%;animation-delay:-5s;width:4px;height:4px"></i><i class="sp" style="left:58%;animation-delay:-3s"></i><i class="sp" style="left:79%;animation-delay:-7s;width:9px;height:9px"></i><i class="sp" style="left:90%;animation-delay:-2s;width:4px;height:4px"></i>
<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11.5 17h9l-.8 7.2a3.2 3.2 0 01-6.4 0z" fill="#F3EAD6"/><path d="M2.5 18C2.5 9 8.4 3 16 3s13.5 6 13.5 15c0 1-2.5 1.6-13.5 1.6S2.5 19 2.5 18z" fill="#F23D57"/><path d="M5 18.3c3.6 1 7.6 1.4 11 1.4s7.4-.4 11-1.4c.6-.2 1 .3.5.7-1.4 1.4-6.7 1.6-11.5 1.6S5.9 20.4 4.5 19c-.5-.4-.1-.9.5-.7z" fill="#B21636" opacity=".55"/><circle cx="10" cy="11.5" r="2.3" fill="#fff"/><circle cx="18.5" cy="8.3" r="1.9" fill="#fff"/><circle cx="23.2" cy="13.6" r="1.7" fill="#fff"/><circle cx="15" cy="15" r="1.2" fill="#fff"/></svg>
<h1>ГрибСвязь</h1>
<p id="s">Просыпаем лес…</p>
<button id="r">Попробовать снова</button>
<script>
// Страницу приложения грузим с сервера: любое обновление интерфейса приходит всем без новой установки APK.
var SERVER='https://gribsvyaz.onrender.com',MAX=100000,t0,done=false;
var s=document.getElementById('s'),r=document.getElementById('r');
function go(){if(done)return;done=true;location.replace(SERVER)}
function ping(){
  if(done)return;
  if(navigator.onLine===false){fail('Нет интернета. Включите сеть и попробуйте снова.');return}
  var c=new AbortController(),to=setTimeout(function(){c.abort()},8000);
  fetch(SERVER+'/health',{cache:'no-store',signal:c.signal}).then(function(x){clearTimeout(to);if(x.ok)go();else retry()}).catch(function(){clearTimeout(to);retry()});
}
function retry(){
  if(done)return;
  if(Date.now()-t0>MAX){fail('Сервер не отвечает. Попробуйте ещё раз через минуту.');return}
  var sec=Math.round((Date.now()-t0)/1000);
  s.textContent=sec>6?'Сервер просыпается, это бывает до минуты…':'Просыпаем лес…';
  setTimeout(ping,2000);
}
function fail(m){s.textContent=m;r.style.display='block'}
function start(){r.style.display='none';s.textContent='Просыпаем лес…';t0=Date.now();ping()}
r.addEventListener('click',start);
window.addEventListener('online',function(){if(r.style.display==='block')start()});
start();
</script></body></html>
