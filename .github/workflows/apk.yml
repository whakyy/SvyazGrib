name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android app
        run: |
          mkdir -p www && cp apk/loader.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "ГрибСвязь" com.gribsvyaz.app --web-dir www
          node -e "const fs=require('fs');const f='capacitor.config.json';if(!fs.existsSync(f)){console.error('нет '+f);process.exit(1)}const c=JSON.parse(fs.readFileSync(f,'utf8'));c.server={androidScheme:'https',allowNavigation:['gribsvyaz.onrender.com']};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          # без этих разрешений в APK не работают звонки, голосовые и кружки
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' $M
          grep -q RECORD_AUDIO $M
          # значок приложения из icon.png
          R=android/app/src/main/res
          for p in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$p"
            convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            convert icon.png -resize $((f*72/108))x$((f*72/108)) -background '#0f1b35' -gravity center -extent ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#0f1b35/I' $R/values/ic_launcher_background.xml
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gribsvyaz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
