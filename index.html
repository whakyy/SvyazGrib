<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>ГрибСвязь</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-screen messenger. Phone: list and chat swap full screens; 860px and up: list left, chat right. Coral marks music and live moments. */
:root{--bg:#EDF0F5;--surface:#FFFFFF;--surface2:#F3F5F9;--fg:#141B26;--muted:#6B7788;--line:#E3E8EF;--accent:#2B6BE4;--accent-fg:#FFFFFF;--accent-soft:#E4EDFD;--out:#2B6BE4;--out-fg:#FFFFFF;--in:#FFFFFF;--warm:#FF6B4A;--warm-soft:#FFEBE5;--ok:#25A06A;--danger:#E5484D;--shadow:0 8px 28px rgba(20,27,38,.12);--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-brand:'Unbounded','Manrope',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1118;--surface:#151C26;--surface2:#1C2531;--fg:#E8EDF4;--muted:#8A97A8;--line:#243040;--accent:#5B93FF;--accent-fg:#071226;--accent-soft:#17263F;--out:#2F5FC4;--in:#1C2531;--warm:#FF8467;--warm-soft:#33201C;--shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1118;--surface:#151C26;--surface2:#1C2531;--fg:#E8EDF4;--muted:#8A97A8;--line:#243040;--accent:#5B93FF;--accent-fg:#071226;--accent-soft:#17263F;--out:#2F5FC4;--in:#1C2531;--warm:#FF8467;--warm-soft:#33201C;--shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#root{height:100%}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.av{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:#fff;font-weight:700;font-size:16px;flex:none;letter-spacing:.02em}
.av.s{width:40px;height:40px;font-size:14px}
.av.xl{width:96px;height:96px;font-size:32px}
.avw{position:relative;flex:none;display:grid}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
.auth{height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:440px;margin:0 auto;padding:24px 20px;overflow:auto}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.32;pointer-events:none}
.orb.a{width:300px;height:300px;background:var(--accent);top:-90px;left:-90px}
.orb.b{width:260px;height:260px;background:var(--warm);bottom:-90px;right:-70px}
.auth>:not(.orb){position:relative}
.brand{display:flex;align-items:center;gap:12px;font:700 20px var(--f-brand)}
.hello h1{font:700 28px/1.15 var(--f-brand);margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.hello p{margin:0;color:var(--muted)}
.card{background:var(--surface);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:14px 16px;outline:0;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{resize:none;min-height:76px}
.phone{display:flex;align-items:center;gap:10px;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:0 16px;transition:border-color .15s,background .15s}
.phone:focus-within{border-color:var(--accent);background:var(--surface)}
.phone b{font-size:18px}
.phone input{border:0;background:none;outline:0;padding:14px 0;font-size:18px;font-weight:600;width:100%;min-width:0;letter-spacing:.02em}
.code{text-align:center;font-size:32px;font-weight:800;letter-spacing:.5em;padding-left:.5em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:15px 18px;border-radius:14px;transition:transform .1s,opacity .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.link{color:var(--accent);font-weight:700}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.err{color:var(--danger);font-size:13px;min-height:1.2em;text-align:center}
.sms{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;max-width:420px;margin:0 auto;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;transform:translateY(-160%);transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
.sms.on{transform:none}
.sms .ico{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.sms small{color:var(--muted);display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);position:relative;overflow:hidden}
.side,.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.main{background:var(--bg)}
@media(min-width:860px){.app{grid-template-columns:380px minmax(0,1fr)}.side{border-right:1px solid var(--line)}.back{display:none}}
@media(max-width:859px){.app[data-view=list] .main{display:none}.app[data-view=chat] .side{display:none}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.top h2{margin:0;font:700 19px var(--f-brand);flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s;flex:none}
.ib:hover,.ib:active{background:var(--surface2)}
.search{margin:4px 16px 8px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:0;padding:11px 0;min-width:0;color:var(--fg)}
.list{flex:1;overflow:auto;padding:4px 8px 12px}
.row{width:100%;display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;transition:background .15s}
.row:hover{background:var(--surface2)}
.row:active,.row.sel{background:var(--accent-soft)}
.r-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-top,.r-bot{display:flex;align-items:center;gap:8px}
.r-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.r-top time{font-size:12px;color:var(--muted)}
.r-last{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}
.r-last em{font-style:normal;color:var(--accent)}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 7px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:800;display:grid;place-items:center}
.tabs{display:flex;border-top:1px solid var(--line);padding:6px 8px;background:var(--surface)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px;position:relative}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
.mini{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--warm-soft);border-top:1px solid var(--line)}
.mini .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mini b,.mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini span{font-size:12px;color:var(--muted)}
.music{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--warm-soft);width:100%}
.music.none{justify-content:center;color:var(--warm);font-weight:700;border:2px dashed var(--warm);background:none}
.mp-btn{width:46px;height:46px;border-radius:50%;background:var(--warm);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--warm) 40%,transparent);transition:transform .15s}
.mp-btn:active{transform:scale(.92)}
.mp-btn .ic+.ic{display:none}
.on>.mp-btn .ic:first-child,.mp-btn.on .ic:first-child{display:none}
.on>.mp-btn .ic+.ic,.mp-btn.on .ic+.ic{display:block}
.mp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mp-info b,.mp-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-info span{font-size:13px;color:var(--muted)}
.pbar{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--warm) 22%,transparent);margin-top:6px;overflow:hidden}
.pbar u{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--warm);border-radius:2px;transition:width .25s linear}
.prof{flex:1;overflow:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 0 2px}
.hero h3{margin:10px 0 0;font:700 21px var(--f-brand)}
.hero .sub{color:var(--muted)}
.bio{background:var(--surface2);border-radius:16px;padding:12px 14px}
.bio small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.menu{background:var(--surface2);border-radius:18px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .ic{color:var(--accent)}
.mrow.danger,.mrow.danger .ic{color:var(--danger)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;margin-left:auto}
.seg button{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.nochat{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px}
.nochat span{background:var(--surface);padding:6px 14px;border-radius:14px;font-weight:600;font-size:13px}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.chead{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:4px 8px;border-radius:14px}
.who span{display:flex;flex-direction:column;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:13px;color:var(--muted)}
.who small.live{color:var(--accent)}
.msgs{flex:1;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:10px 0 6px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px}
.msg{display:flex;flex-direction:column;max-width:min(82%,520px);width:fit-content}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start}
.bub{display:block;text-align:left;padding:8px 12px 6px;border-radius:20px;background:var(--in);box-shadow:0 1px 2px rgba(20,27,38,.07)}
.bub.new,.typing .bub{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.out .bub{background:var(--out);color:var(--out-fg);border-bottom-right-radius:6px}
.in .bub{border-bottom-left-radius:6px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:inline-flex;align-items:center;gap:3px;float:right;margin:7px 0 0 10px;font-size:11px;opacity:.72;line-height:1}
.meta .ic{width:16px;height:16px;stroke-width:2.4}
.quote{border-left:3px solid var(--warm);padding:2px 8px;margin-bottom:5px;font-size:13px;background:color-mix(in srgb,currentColor 9%,transparent);border-radius:6px;overflow:hidden}
.quote b{display:block;color:var(--warm)}
.out .quote b{color:#fff}
.quote span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.react{margin:-8px 8px 0;background:var(--surface);border-radius:12px;padding:1px 7px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative}
.typing .bub{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;background:var(--surface);border-top:1px solid var(--line);font-size:13px}
.rbar .t{flex:1;min-width:0;border-left:3px solid var(--warm);padding-left:8px}
.rbar b{display:block;color:var(--warm)}
.rbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.comp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
.comp textarea{flex:1;min-width:0;resize:none;max-height:140px;background:var(--surface2);border:0;border-radius:22px;padding:11px 16px;outline:0;line-height:1.35}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none;transition:transform .12s,opacity .15s}
.send:active{transform:scale(.92)}
.send[disabled]{opacity:.35}
.sheet-host{position:absolute;inset:0;pointer-events:none;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(8,12,18,.5);opacity:0;transition:opacity .2s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:90%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);pointer-events:auto;display:flex;flex-direction:column;gap:12px}
.sheet-host.on .scrim{opacity:1}
.sheet-host.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.sheet h3{margin:0;font:700 18px var(--f-brand)}
.reacts{display:flex;justify-content:space-between;background:var(--surface2);border-radius:20px;padding:6px 10px}
.reacts button{font-size:26px;padding:6px 8px;border-radius:12px;transition:transform .12s}
.reacts button:active{transform:scale(1.3)}
.trk{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;width:100%}
.trk.sel{background:var(--warm-soft)}
.trk .mp-btn{width:40px;height:40px}
.trk .mp-info{pointer-events:none}
.pick{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tab.on{background:var(--accent-soft)}
.out .bub{background:linear-gradient(160deg,color-mix(in srgb,var(--out) 80%,#fff),var(--out))}
.msgs{background-image:radial-gradient(color-mix(in srgb,var(--fg) 8%,transparent) 1.3px,transparent 1.6px);background-size:24px 24px}
.msg:not(.g){margin-top:7px}
.msg.out.g .bub{border-top-right-radius:8px}
.msg.in.g .bub{border-top-left-radius:8px}
.now{display:flex;gap:12px;overflow-x:auto;padding:4px 12px 12px;scrollbar-width:none}
.now::-webkit-scrollbar{display:none}
.nw{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;flex:none;padding:4px 0}
.nw b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw .tt{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--warm),var(--accent),var(--warm))}
.ring .av{width:54px;height:54px;border:3px solid var(--surface)}
.nw.on .ring{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warm) 28%,transparent)}}
.sec{padding:8px 18px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eq{display:none;gap:2px;align-items:flex-end;height:18px;flex:none}
.on>.eq{display:flex}
.eq i{width:3px;height:4px;background:var(--warm);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.emo{display:grid;grid-template-columns:repeat(8,1fr);padding:6px 10px;background:var(--surface);border-top:1px solid var(--line)}
.emo button{font-size:24px;padding:6px 0;text-align:center;border-radius:10px}
.emo button:active{background:var(--surface2)}
.sw{display:flex;gap:14px;padding:4px 16px 16px}
.sw button{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 3px var(--surface2)}
.sw button.on{box-shadow:0 0 0 3px var(--surface2),0 0 0 5px var(--fg)}
.cover{height:96px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--warm));flex:none}
.cover+.hero{margin-top:-54px}
.cover+.hero .av.xl{border:4px solid var(--surface)}
.steps{display:flex;gap:6px}
.steps i{height:5px;flex:1;border-radius:3px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--accent)}
.otp{display:flex;gap:10px;justify-content:center}
.otp .o{width:58px;height:66px;text-align:center;font-size:28px;font-weight:800;border-radius:16px;background:var(--surface2);border:2px solid transparent;outline:0;padding:0}
.otp .o:focus{border-color:var(--accent);background:var(--surface)}
.otp.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sp{position:fixed;bottom:-20px;width:8px;height:8px;border-radius:50%;background:var(--warm);opacity:.35;animation:rise 10s linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}
.pv{display:grid;place-items:center}
.otp{gap:8px}
.otp .o{width:min(46px,12.5vw);height:60px;font-size:26px;border-radius:14px}
.card a.btn{text-decoration:none}
.nochat .btn{margin-top:2px}
/* переключатель */
.tg{margin-left:auto;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(18px)}
/* режим «Стекло»: полупрозрачные панели с размытием поверх цветного фона */
:root{--g1:#b9d2ff;--g2:#ffcfc0;--g3:#d6c6ff;--gl:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#1d3570;--g2:#6a2f25;--g3:#3d2670;--gl:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--g1:#1d3570;--g2:#6a2f25;--g3:#3d2670;--gl:rgba(255,255,255,.14)}

  const m={id:uid(),from:'me',text:t,ts:Date.now(),status:'sent',reply:REPLY||null};
  (S.chats[id]=S.chats[id]||[]).push(m);NEWID=m.id;REPLY=null;DRAFT[id]='';inp.value='';growInp();
  try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}
  $('#sendb').disabled=true;renderReply();save();renderMsgs(true);renderList();
  setTimeout(()=>{if(!S)return;m.status='read';save();if(S.open===id)renderMsgs()},900);
  if(!ONLINE)botReply(id,t);
}
function sheet(html){
  const h=$('#sheets');if(!h)return;
  h.innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.add('on')));
}
function closeSheet(){const h=$('#sheets');if(!h)return;h.classList.remove('on');setTimeout(()=>{if(!h.classList.contains('on'))h.innerHTML=''},320)}
function msgSheet(id){
  const m=(S.chats[S.open]||[]).find(x=>x.id===id);if(!m)return;
  sheet('<div class="reacts">'+['❤️','👍','😂','😮','🙏'].map(e=>'<button data-act="react" data-id="'+id+'" data-e="'+e+'" aria-label="Реакция">'+e+'</button>').join('')+'</div><div class="menu"><button class="mrow" data-act="reply" data-id="'+id+'">'+ic('reply')+'<span>Ответить</span></button><button class="mrow" data-act="copy" data-id="'+id+'">'+ic('copy')+'<span>Копировать</span></button>'+(!ONLINE||m.from==='me'?'<button class="mrow danger" data-act="del" data-id="'+id+'">'+ic('trash')+'<span>Удалить</span></button>':'')+'</div>');
}
function cprofileSheet(id){
  const c=cById(id);if(!c)return;
  const tr=c.track?trkInfo(c.track):null;
  sheet('<div class="hero">'+avatar(c.name,c.id,'xl')+'<h3>'+esc(c.name)+'</h3><div class="sub">'+esc(statusText(c))+'</div></div>'+(c.bio?'<div class="bio"><small>О себе</small>'+esc(c.bio)+'</div>':'')+(c.phone?'<div class="bio"><small>Телефон</small>'+esc(c.phone)+'</div>':'')+(c.username?'<div class="bio"><small>Имя пользователя</small>@'+esc(c.username)+'</div>':'')+(tr?'<div class="bio" style="background:none;padding:0"><small style="padding:0 2px 6px">Музыка в профиле</small>'+musicCard(tr,false)+'</div>':'')+'<button class="btn ghost" data-act="close">Закрыть</button>');
}
function editSheet(){
  const m=S.me;
  sheet('<h3>Редактировать профиль</h3><form id="f-edit" class="fld" style="gap:12px"><div class="fld"><label for="en">Имя</label><input id="en" class="inp" maxlength="40" value="'+esc(m.name)+'"></div><div class="fld"><label for="eu">Имя пользователя</label><input id="eu" class="inp" maxlength="20" autocapitalize="none" value="'+esc(m.username)+'" placeholder="@username"></div><div class="fld"><label for="eb">О себе</label><textarea id="eb" class="inp" maxlength="120">'+esc(m.bio)+'</textarea></div><div class="err" id="eerr"></div><button class="btn">Сохранить</button></form>');
}
function trackRow(k,title,artist){
  const sel=S.me.track&&S.me.track.key===k;
  return '<div class="trk'+(sel?' sel':'')+'" data-key="'+k+'"><button class="mp-btn" data-act="play" data-key="'+k+'" aria-label="Прослушать">'+ic('play','fill')+ic('pause','fill')+'</button><button class="pick" data-act="use-track" data-key="'+k+'"><span class="mp-info"><b>'+esc(title)+'</b><span>'+esc(artist)+(sel?' · сейчас в профиле':'')+'</span></span></button></div>';
}
function trackSheet(){
  let h='<h3>Музыка в профиле</h3><p class="hint" style="text-align:left">Нажмите на название, чтобы поставить трек в профиль. Кнопка слева включает превью.</p>';
  if(S.me.track&&S.me.track.key==='custom')h+=trackRow('custom',S.me.track.title,S.me.track.artist);
  h+=Object.keys(TRACKS).map(k=>trackRow(k,TRACKS[k].t,TRACKS[k].a)).join('');
  h+='<label class="btn ghost" style="cursor:pointer">'+ic('plus')+'Загрузить свой файл<input type="file" id="file" accept="audio/*" hidden></label>';
  if(S.me.track)h+='<button class="btn ghost" data-act="no-track" style="color:var(--danger)">Убрать музыку из профиля</button>';
  sheet(h);syncPlayer();
}
function addSheet(){
  if(ONLINE){sheet('<h3>Найти друга</h3><form id="f-find" class="fld" style="gap:12px"><div class="fld"><label for="fq">Номер телефона или @имя</label><input id="fq" class="inp" maxlength="40" autocomplete="off" autocapitalize="none" placeholder="+7 900 123-45-67 или @username"></div><div class="err" id="aerr"></div><button class="btn">Найти и написать</button><p class="hint">Друг должен быть зарегистрирован в ГрибСвязь. Если его ещё нет, отправьте ему приглашение из профиля.</p></form>');return}
  sheet('<h3>Новый контакт</h3><form id="f-add" class="fld" style="gap:12px"><div class="fld"><label for="nn">Имя</label><input id="nn" class="inp" maxlength="40" placeholder="Как подписать"></div><div class="fld"><label for="np">Телефон</label><div class="phone"><b>+7</b><input id="np" type="tel" inputmode="tel" placeholder="(900) 123-45-67"></div></div><div class="err" id="aerr"></div><button class="btn">Добавить и написать</button></form>');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||!S)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'tab':S.tab=t.dataset.tab;Q='';save();renderSide();break;
    case 'open':closeSheet();openChat(id);break;
    case 'back':closeChat();break;
    case 'cprofile':cprofileSheet(id);break;
    case 'play':togglePlay(t.dataset.key);break;
    case 'mini-stop':stopAll();break;
    case 'pick-track':trackSheet();break;
    case 'use-track':{const k=t.dataset.key;const i=trkInfo(k);if(i){S.me.track={key:k,title:i.title,artist:i.artist};save();closeSheet();renderSide();toast(ONLINE&&k==='custom'?'Свой файл виден только вам':'Музыка добавлена в профиль');if(ONLINE)api('/api/me','PUT',{track:k==='custom'?null:{key:k}}).catch(er=>toast(errText(er)))}break}
    case 'no-track':S.me.track=null;stopAll();save();closeSheet();renderSide();if(ONLINE)api('/api/me','PUT',{track:null}).catch(()=>{});break;
    case 'invite':{const link=API||location.origin,txt='Заходи в ГрибСвязь, пообщаемся: '+link;try{navigator.clipboard.writeText(txt).then(()=>toast('Приглашение скопировано, отправьте его другу'),()=>toast(link))}catch(x){toast(link)}break}
    case 'edit-prof':editSheet();break;
    case 'theme':S.theme=t.dataset.v;applyTheme();save();renderSide();break;
    case 'logout':{if(ONLINE){api('/api/logout','POST',{}).catch(()=>{});if(ES){ES.close();ES=null}}stopAll();try{localStorage.removeItem(KEY)}catch(x){}S=null;TOK=null;TYP={};DRAFT={};REPLY=null;applyTheme();renderAuth('phone');break}
    case 'newc':addSheet();break;
    case 'close':closeSheet();break;
    case 'msg':msgSheet(id);break;
    case 'react':{const m=(S.chats[S.open]||[]).find(x=>x.id===id);if(m){m.react=m.react===t.dataset.e?null:t.dataset.e;save();renderMsgs();if(ONLINE&&!isTemp(m.id))api('/api/react','POST',{id:m.id,emoji:m.react}).catch(()=>{})}closeSheet();break}
    case 'reply':REPLY=id;closeSheet();renderReply();{const i=$('#inp');if(i&&matchMedia('(pointer:fine)').matches)i.focus()}break;
    case 'cancel-reply':REPLY=null;renderReply();break;
    case 'emo':{const e=$('#emo');if(e)e.hidden=!e.hidden;break}
    case 'addemo':{const i=$('#inp');if(i){i.value+=t.dataset.e;DRAFT[S.open]=i.value;growInp();$('#sendb').disabled=false}break}
    case 'glass':S.glass=!S.glass;applyTheme();save();renderSide();break;
    case 'accent':S.accent=t.dataset.v||null;applyTheme();save();renderSide();break;
    case 'copy':{const m=(S.chats[S.open]||[]).find(x=>x.id===id);closeSheet();if(m){try{navigator.clipboard.writeText(m.text).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(x){toast('Не удалось скопировать')}}break}
    case 'del':{const arr=S.chats[S.open]||[];const i=arr.findIndex(x=>x.id===id);if(ONLINE&&i>=0&&!isTemp(id))api('/api/delete','POST',{id}).catch(()=>toast('Не удалось удалить'));if(i>=0)arr.splice(i,1);if(REPLY===id)REPLY=null;save();closeSheet();renderMsgs();renderReply();renderList();break}
  }
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!S)return;
  if(f.id==='comp'){e.preventDefault();send()}
  else if(f.id==='f-edit'){
    e.preventDefault();
    const nm=$('#en').value.trim(),un=$('#eu').value.trim().replace(/^@/,'');
    if(nm.length<2){$('#eerr').textContent='Введите имя';return}
    if(un&&!/^[A-Za-z0-9_]{3,20}$/.test(un)){$('#eerr').textContent=ERR.bad_username;return}
    if(ONLINE){try{await api('/api/me','PUT',{name:nm,username:un,bio:$('#eb').value.trim()})}catch(er){$('#eerr').textContent=errText(er);return}}
    S.me.name=nm;S.me.username=un;S.me.bio=$('#eb').value.trim();save();closeSheet();renderSide();toast('Профиль сохранён');
  }else if(f.id==='f-find'){
    e.preventDefault();
    const q=$('#fq').value.trim();if(!q)return;
    try{
      const r=await api('/api/find?q='+encodeURIComponent(q));
      await api('/api/contacts','POST',{id:r.user.id});
      if(!cById(r.user.id)){S.contacts.push(mapUser(r.user));S.chats[r.user.id]=[]}
      save();closeSheet();S.tab='chats';openChat(r.user.id);
    }catch(er){$('#aerr').textContent=errText(er)}
  }else if(f.id==='f-add'){
    e.preventDefault();
    const nm=$('#nn').value.trim(),d=$('#np').value.replace(/\D/g,'');
    if(nm.length<2){$('#aerr').textContent='Введите имя';return}
    if(d.length!==10){$('#aerr').textContent='Введите номер полностью';return}
    const c={id:'u'+uid(),name:nm,phone:'+7 '+$('#np').value,bio:'',track:null,online:true,rep:GEN};
    S.contacts.push(c);S.chats[c.id]=[];save();closeSheet();openChat(c.id);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!S)return;
  if(t.id==='q'){Q=t.value;const l=$('#list');if(l)l.innerHTML=listHtml()}
  else if(t.id==='inp'){DRAFT[S.open]=t.value;growInp();$('#sendb').disabled=!t.value.trim();if(ONLINE&&t.value&&Date.now()-LASTTYP>3000){LASTTYP=Date.now();api('/api/typing','POST',{to:S.open}).catch(()=>{})}}
  else if(t.id==='np'){let d=t.value.replace(/\D/g,'');if(d.length>10&&/^[78]/.test(d))d=d.slice(1);t.value=fmtPhone(d)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='inp'&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(S&&t.id==='file'&&t.files&&t.files[0]){
    const f=t.files[0];
    if(CUSTOM.url)URL.revokeObjectURL(CUSTOM.url);
    CUSTOM.url=URL.createObjectURL(f);
    S.me.track={key:'custom',title:f.name.replace(/\.[^.]+$/,'').slice(0,40)||'Мой трек',artist:'Мой файл'};
    save();closeSheet();renderSide();toast('Трек добавлен в профиль');
  }
});
S=load();
// Старые выдуманные контакты из ранних версий убираем из сохранённых данных
if(S&&S.contacts&&!ONLINE){const old=['alina','max','mama','danya','lena'];S.contacts=S.contacts.filter(c=>!old.includes(c.id));old.forEach(i=>{if(S.chats)delete S.chats[i];if(S.unread)delete S.unread[i]});if(old.includes(S.open))S.open=null;save()}
if(S&&S.me&&S.contacts&&(!ONLINE||S.tok)){
  TOK=S.tok||null;applyTheme();renderApp();
  if(ONLINE){sync().then(()=>{renderSide();renderMain()}).catch(()=>{});connect()}
}else{S=null;renderAuth('phone')}
document.addEventListener('visibilitychange',()=>{if(ONLINE&&S&&!document.hidden){if(S.open)markRead(S.open);renderList()}});
</script></body></html>
